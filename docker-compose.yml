version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gem_compliance_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=SmartBid Verification
      - PROJECT_VERSION=1.0.0
      - SECRET_KEY=gem_super_secure_production_secret_key_2026_sih_ps100
      - DATABASE_URL=sqlite:///./gem_compliance.db
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
    volumes:
      - backend_db_data:/app
    networks:
      - gem_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gem_compliance_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gem_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 20s
      timeout: 5s
      retries: 3

networks:
  gem_network:
    driver: bridge

volumes:
  backend_db_data:
    driver: local
